<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOOF · App prototype</title>
<meta name="description" content="A click-through of the Woof dog wellness app, from first launch to everyday use.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="WOOF · App prototype">
<meta property="og:description" content="A click-through of the Woof dog wellness app, from first launch to everyday use.">
<meta property="og:image" content="https://uygaracar.github.io/woof-app-prototype/og.jpg">
<meta property="og:url" content="https://uygaracar.github.io/woof-app-prototype/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app/css/app.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #ecebe8; overflow: hidden; }
  .shell { height: 100vh; height: 100dvh; display: grid; grid-template-columns: 300px 1fr 380px; }
  .side, .info { background: #f7f7f5; overflow: auto; }
  .side { padding: 34px 20px 30px; border-right: 1px solid #e0dfdb; display: flex; flex-direction: column; }
  .side > img { height: 15px; width: auto; align-self: flex-start; margin-left: 10px; }
  .side h1 { font-size: 26px; font-weight: 340; letter-spacing: -0.035em; margin: 22px 10px 8px; line-height: 1.1; }
  .side .intro { font-size: 13.5px; color: var(--muted); margin: 0 10px; line-height: 1.55; }
  .grp { margin-top: 20px; }
  .grp p { font-size: 10.5px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--faint); margin: 0 10px 6px; }
  .grp a { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 10px; font-size: 14px; color: #3a3a3c; text-decoration: none; }
  .grp a:hover { background: #ecebe8; }
  .grp a.is-on { background: #111; color: #fff; }
  .grp a span { font-size: 11.5px; color: #a1a1a6; width: 18px; font-variant-numeric: tabular-nums; }
  .grp a.is-on span { color: rgba(255,255,255,.5); }
  .side .fine { margin-top: auto; padding: 26px 10px 0; font-size: 11.5px; color: var(--faint); line-height: 1.5; }
  .stage { position: relative; overflow: hidden; min-height: 0; }
  .scaler { position: absolute; left: 50%; top: 50%; transform-origin: center; }
  .info { padding: 40px 32px; border-left: 1px solid #e0dfdb; display: flex; flex-direction: column; }
  .count { font-size: 64px; font-weight: 250; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
  .count span { font-size: 22px; color: var(--faint); letter-spacing: -0.02em; }
  .info .lbl { margin-top: 26px; display: block; }
  .info h2 { font-size: 30px; font-weight: 360; letter-spacing: -0.035em; line-height: 1.1; margin: 10px 0 0; }
  .info .cap { font-size: 16px; line-height: 1.55; color: var(--ink-2); margin-top: 14px; }
  .info .hint { font-size: 13px; color: var(--muted); margin-top: 18px; }
  .btns { display: flex; gap: 8px; margin-top: 26px; }
  .btns button { flex: 1; height: 46px; border-radius: 99px; background: #111; color: #fff; font-size: 14px; font-weight: 550; }
  .btns button:first-child { background: #fff; color: #111; box-shadow: inset 0 0 0 1px #d9d8d4; }
  .video { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 16px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px #e6e5e1; font-size: 14px; color: #111; text-decoration: none; }
  .video[hidden] { display: none; }
  .video i { width: 28px; height: 28px; border-radius: 50%; background: #111; display: grid; place-items: center; flex: none; }
  .video i::before { content: ""; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
  .info .fine { margin-top: auto; font-size: 11.5px; color: var(--faint); line-height: 1.5; padding-top: 24px; }

  /* Phone: the bare app screen, fitted to the viewport, with a caption bar */
  .bar { display: none; }
  .bare { border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 24px 50px -20px rgba(0,0,0,.35); }
  @media (max-width: 899px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .side, .info { display: none; }
    .bar { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 6px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: #f7f7f5; border-top: 1px solid #e0dfdb; }
    .bar button { width: 48px; height: 48px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; }
    .bar button:first-child { background: #fff; color: #111; box-shadow: inset 0 0 0 1px #d9d8d4; }
    .bar button svg { width: 20px; height: 20px; }
    .bar__t { text-align: center; min-width: 0; }
    .bar__t b { display: block; font-size: 14.5px; font-weight: 600; letter-spacing: -0.015em; }
    .bar__t b span { color: var(--faint); font-weight: 500; margin-right: 6px; font-variant-numeric: tabular-nums; }
    .bar__t p { font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="stage" id="stage"><div class="scaler" id="scaler"></div></main>
  <aside class="info" id="info"></aside>
  <nav class="bar" id="bar"></nav>
</div>
<script src="app/js/ui.js"></script>
<script src="app/js/screens.js"></script>
<script src="app/js/captions.js"></script>
<script src="app/js/share.js"></script>
</body>
</html>
